# Netlify build configuration.
#
# Without this file Netlify reported "No config file was defined: using default values", which set
# `publish` to the repo root — the same path as the base directory — and @netlify/plugin-nextjs
# refuses that outright:
#
#   Error: Your publish directory cannot be the same as the base directory of your site.
#
# The Next.js runtime wants the build output directory, not the repo root. Everything the app
# actually serves (SSR pages, all ~79 API routes, the middleware) is produced by the plugin from
# `.next` — an earlier deploy that shipped 452 static assets with "No functions deployed" and
# "No edge functions deployed" was this same misconfiguration one step further along: it uploaded
# the build's static files and none of the app.

[build]
  command = "npm run build"
  publish = ".next"

  # Skip the build entirely when a push changes nothing the deployed app is built from — docs,
  # plans, agent config, database migrations (applied via execute_sql, never read at build time),
  # local scripts. Exit 0 = skip, exit 1 = build; a push where CACHED_COMMIT_REF is unavailable
  # (first build, cleared cache) diffs nothing and MUST build, hence the `|| exit 1` guard.
  # Every skipped build is credits not spent on a deploy that would have been byte-identical.
  ignore = "if [ -z \"$CACHED_COMMIT_REF\" ] || [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; then exit 1; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ':(exclude)*.md' ':(exclude).claude' ':(exclude)supabase/migrations' ':(exclude)scripts' ':(exclude).env.local.example'"

  # Netlify's secrets scanner fails a build when a value marked "secret" appears in the deploy
  # output — and every NEXT_PUBLIC_* value is INLINED into the client JS bundle by design. So a
  # NEXT_PUBLIC_* var marked secret in the Netlify UI guarantees a failed build with
  # "Secrets scanning found secrets in build output", which reads like a leak but is the intended
  # behaviour of the framework.
  #
  # These are public by construction: the anon key and publishable key are meant to ship to
  # browsers, the cloud name appears in every delivery URL, the site hostname is the address a
  # tenant CNAMEs to, and the app/root/cookie domains are the site's own name. Omitting them from
  # the scan is correct rather than a suppression — the scanner should still fail the build if a
  # genuinely private value (the service-role key, Stripe secret, the Netlify PAT) ever reaches
  # the bundle.
  #
  # ADD EVERY NEW NEXT_PUBLIC_* VAR TO THIS LIST when you add it in the Netlify UI. The last three
  # are listed BEFORE they are set, deliberately: the scanner reads env values, so the build only
  # breaks once the variable exists, which makes the omission look like an unrelated regression at
  # exactly the moment someone is changing something else.
  [build.environment]
    SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY,NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME,NEXT_PUBLIC_NETLIFY_SITE_HOSTNAME,NEXT_PUBLIC_ROOT_DOMAIN,NEXT_PUBLIC_COOKIE_DOMAIN"

# The plugin is also enabled in the Netlify UI (the failing build logged `origin: ui`). Declaring it
# here as well is idempotent and makes the dependency visible in the repo rather than only in
# somebody's dashboard.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# `NEXT_PUBLIC_*` values are inlined at BUILD time, not read at runtime, so every one of them has to
# exist in Netlify's environment before the build runs — setting one afterwards changes nothing
# until the next deploy. NEXT_PUBLIC_APP_URL is the load-bearing one: middleware.ts rewrites any
# request whose Host doesn't match it to /d${pathname}, so pointing it at the wrong host does not
# degrade gracefully, it 404s every page of the app.
#
# Deliberately NOT listed here — secrets belong in the Netlify UI, never in a committed file.
